<div class="container mt-5">
  <div *ngIf="job" class="card shadow-lg rounded-4 p-4">
    <div class="card-body">

      <!-- Job Title -->
      <div class="mb-3">
        <h5 class="text-muted mb-1">Job Title</h5>
        <h2 class="text-success">{{ job.title }}</h2>
      </div>

      <!-- Location -->
      <div class="mb-3">
        <h6 class="text-muted mb-1">Location</h6>
        <p class="fs-5">
          <i class="bi bi-geo-alt-fill me-1"></i>{{ job.location }}
        </p>
      </div>

      <!-- Description -->
      <div class="mb-3">
        <h6 class="text-muted mb-1">Job Description</h6>
        <p class="fs-6">{{ job.description }}</p>
      </div>

      <!-- Employer -->
      <div class="mb-4">
        <h6 class="text-muted mb-1">Posted by</h6>
        <p class="fs-6">{{ job.employerName }}</p>
      </div>

      <!-- Apply Button -->
      <div class="text-end">
        <a
          class="btn btn-primary btn-lg"
          [routerLink]="['/candidate/jobs', job.id, 'apply']"
          [class.disabled]="alreadyApplied"
          [attr.aria-disabled]="alreadyApplied"
          tabindex="{{ alreadyApplied ? -1 : 0 }}"
        >
          {{ alreadyApplied ? 'Already Applied' : 'Apply Now' }}
        </a>
      </div>
    </div>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="alert alert-danger text-center mt-5">
    {{ errorMessage }}
  </div>

  <!-- Back Link -->
  <div class="mt-4 text-start">
    <a routerLink="/candidate/jobs" class="btn btn-outline-secondary">
      ← Back to Job Listings
    </a>
  </div>
</div>
