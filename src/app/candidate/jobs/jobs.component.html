<div class="container mt-5">
  <h3 class="mb-4 text-primary">Explore Available Jobs</h3>

  <!-- Error message -->
  <div *ngIf="errorMessage" class="alert alert-danger text-center">
    {{ errorMessage }}
  </div>

  <!-- Job list -->
  <div class="row" *ngIf="jobs.length > 0">
    <div class="col-md-6 col-lg-4 mb-4" *ngFor="let job of jobs">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5 class="card-title text-success">{{ job.title }}</h5>
          <h6 class="card-subtitle mb-2 text-muted">{{ job.location }}</h6>
          <p class="card-text text-truncate" style="max-height: 80px">
            {{ job.description }}
          </p>
        </div>
        <div class="card-footer text-end bg-white border-top-0">
          <a
            [routerLink]="['/candidate/jobs', job.id]"
            class="btn btn-outline-primary btn-sm"
          >
            View Details
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Back to Dashboard Button -->
  <div class="mb-4">
    <a routerLink="/candidate/dashboard" class="btn btn-outline-secondary">
      ← Back to Dashboard
    </a>
  </div>

  <!-- Empty state -->
  <div
    *ngIf="jobs.length === 0 && !errorMessage"
    class="text-muted text-center mt-4"
  >
    No jobs available at the moment.
  </div>
</div>
