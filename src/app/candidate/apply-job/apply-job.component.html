<div class="container mt-5" *ngIf="applyForm">
  <h3 class="mb-4 text-success">Apply for This Job</h3>

  <div *ngIf="errorMessage" class="alert alert-danger text-center">
    {{ errorMessage }}
  </div>
  <div *ngIf="successMessage" class="alert alert-success text-center">
    {{ successMessage }}
  </div>

  <form [formGroup]="applyForm" (ngSubmit)="onSubmit()">
    <!-- Message -->
    <div class="form-floating mb-3">
      <textarea
        class="form-control"
        id="message"
        formControlName="message"
        placeholder="Why are you a good fit?"
        style="height: 120px"
      ></textarea>
      <label for="message">Cover Letter / Message</label>
    </div>

    <!-- Resume Link -->
    <div class="form-floating mb-4">
      <input
        type="url"
        class="form-control"
        id="resumeLink"
        formControlName="resumeLink"
        placeholder="https://your-resume-link.com"
      />
      <label for="resumeLink">Resume URL (optional)</label>
    </div>

    <div class="d-grid">
      <button
        type="submit"
        class="btn btn-success btn-lg"
        [disabled]="applyForm.invalid"
      >
        Submit Application
      </button>
    </div>
  </form>
</div>
