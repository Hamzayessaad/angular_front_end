<div class="container min-vh-100 d-flex justify-content-center align-items-center bg-light">
  <div class="card p-4 shadow rounded-4" style="width: 100%; max-width: 420px;">
    
    <!-- Header -->
    <div class="text-center mb-4">
      <img
        src="https://cdn-icons-png.flaticon.com/512/5087/5087579.png"
        alt="Login Icon"
        width="70"
        class="mb-3"
      />
      <h3 class="fw-bold text-primary">Welcome Back</h3>
      <p class="text-muted small">Login to access your account</p>
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

      <!-- Error Alert -->
      <div *ngIf="errorMessage" class="alert alert-danger text-center mb-4">
        {{ errorMessage }}
      </div>

      <!-- Email -->
      <div class="form-floating mb-3">
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          placeholder="Email"
          required
        />
        <label for="email">Email address</label>
      </div>

      <!-- Password -->
      <div class="form-floating mb-4">
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-control"
          placeholder="Password"
          required
        />
        <label for="password">Password</label>
      </div>

      <!-- Submit Button -->
      <div class="d-grid mb-3">
        <button type="submit" class="btn btn-primary btn-lg" [disabled]="loginForm.invalid">
          Login
        </button>
      </div>

      <!-- Link to Register -->
      <div class="text-center">
        <small>
          Don't have an account?
          <a routerLink="/register" class="text-decoration-none">Register here</a>
        </small>
      </div>
    </form>
  </div>
</div>
