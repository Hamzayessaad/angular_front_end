<div class="container min-vh-100 d-flex justify-content-center align-items-center bg-light">
  <div class="card p-4 shadow rounded-4" style="width: 100%; max-width: 480px;">
    <div class="text-center mb-4">
      <img
        src="https://cdn-icons-png.flaticon.com/512/5087/5087579.png"
        alt="Register Icon"
        width="70"
        class="mb-3"
      />
      <h3 class="fw-bold text-success">Create an Account</h3>
      <p class="text-muted small">Join us as a candidate or an employer</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div *ngIf="errorMessage" class="alert alert-danger text-center">
        {{ errorMessage }}
      </div>
      <div *ngIf="successMessage" class="alert alert-success text-center">
        {{ successMessage }}
      </div>

      <div class="form-group mb-3">
        <label class="form-label">Full Name</label>
        <input
          type="text"
          class="form-control form-control-lg"
          formControlName="fullname"
          placeholder="Enter your full name"
          required
        />
      </div>

      <div class="form-group mb-3">
        <label class="form-label">Email Address</label>
        <input
          type="email"
          class="form-control form-control-lg"
          formControlName="email"
          placeholder="Enter your email"
          required
        />
      </div>

      <div class="form-group mb-3">
        <label class="form-label">Password</label>
        <input
          type="password"
          class="form-control form-control-lg"
          formControlName="password"
          placeholder="Create a password"
          required
        />
      </div>

      <div class="form-group mb-4">
        <label class="form-label">Registering As</label>
        <select class="form-select form-select-lg" formControlName="role" required>
          <option value="" disabled selected>Select your role</option>
          <option value="candidate">Candidate</option>
          <option value="employer">Employer</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <div class="d-grid mb-3">
        <button type="submit" class="btn btn-success btn-lg" [disabled]="registerForm.invalid">
          Register
        </button>
      </div>

      <div class="text-center">
        <small>
          Already registered?
          <a routerLink="/login" class="text-decoration-none">Login here</a>
        </small>
      </div>
    </form>
  </div>
</div>
