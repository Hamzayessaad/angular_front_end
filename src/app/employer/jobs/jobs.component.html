<div class="container mt-5">
  <h3 class="mb-4 text-success">My Posted Jobs</h3>

  <!-- Alerts -->
  <div *ngIf="errorMessage" class="alert alert-danger text-center">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="alert alert-success text-center">{{ successMessage }}</div>

  <!-- Jobs Table -->
  <table *ngIf="jobs.length > 0" class="table table-striped table-bordered">
    <thead class="table-light">
      <tr>
        <th>Title</th>
        <th>Location</th>
        <th>Description</th>
        <th class="text-center">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let job of jobs">
        <td>{{ job.title }}</td>
        <td>{{ job.location }}</td>
        <td>{{ job.description }}</td>
        <td class="text-center">
          <button class="btn btn-sm btn-outline-primary me-2" (click)="editJob(job)">Edit</button>
          <button class="btn btn-sm btn-outline-danger" (click)="deleteJob(job.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Empty State -->
  <div *ngIf="jobs.length === 0 && !errorMessage" class="text-muted text-center mt-4">
    You haven't posted any jobs yet.
  </div>
</div>
