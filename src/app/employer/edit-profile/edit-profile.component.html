<div class="container mt-5" *ngIf="profileForm">
    <h3 class="text-primary mb-4">Edit Profile</h3>
  
    <div *ngIf="errorMessage" class="alert alert-danger text-center">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="alert alert-success text-center">{{ successMessage }}</div>
  
    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
      <!-- Fullname -->
      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="fullname"
          formControlName="fullname"
          placeholder="Full Name"
        />
        <label for="fullname">Full Name</label>
      </div>
  
      <!-- Password -->
      <div class="form-floating mb-4">
        <input
          type="password"
          class="form-control"
          id="password"
          formControlName="password"
          placeholder="Password"
        />
        <label for="password">New Password (optional)</label>
      </div>
  
      <!-- Submit -->
      <div class="d-grid">
        <button type="submit" class="btn btn-success btn-lg" [disabled]="profileForm.invalid">
          Save Changes
        </button>
      </div>
    </form>
  </div>
